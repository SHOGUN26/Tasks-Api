info:
  name: Tasks compeleted
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/tasks/{{taskId}}/complete"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus(), JSON.stringify(res.getBody())).to.equal(200);
        });

        test("L'id correspond", function () {
          expect(String(res.getBody().id)).to.equal(String(bru.getEnvVar("taskId")));
        });

        test("La tâche est marquée comme complétée", function () {
          expect(res.getBody().completed).to.equal(true);
        });

        test("Appartient au bon utilisateur", function () {
          expect(String(res.getBody().userId)).to.equal(String(bru.getEnvVar("userId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
