info:
  name: Update Task
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/tasks/{{taskId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "completed": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus(), JSON.stringify(res.getBody())).to.equal(200);
        });

        test("L'id est inchangé", function () {
          const idDansUrl = req.getUrl().split("?")[0].split("/").pop();
          expect(String(res.getBody().id)).to.equal(String(idDansUrl));
        });

        test("completed est modifié", function () {
          let sent = req.getBody();
          if (typeof sent === "string") sent = JSON.parse(sent);
          expect(res.getBody().completed).to.equal(sent.completed);
        });

        test("Appartient au bon utilisateur", function () {
          expect(String(res.getBody().userId)).to.equal(String(bru.getEnvVar("userId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
