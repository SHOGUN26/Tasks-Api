info:
  name: Find One Tasks
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/tasks/{{taskId}}"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  variables:
    - name: taskId
      value: "12"
  scripts:
    - type: after-response
      code: bru.setEnvVar("taskId", res.getBody().id);
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus(), JSON.stringify(res.getBody())).to.equal(200);
        });

        test("La réponse est un objet tâche", function () {
          const body = res.getBody();
          expect(Array.isArray(body)).to.equal(false);
          expect(body).to.have.property("id");
        });

        test("L'id correspond", function () {
          expect(String(res.getBody().id)).to.equal(String(bru.getEnvVar("taskId")));
        });

        test("Appartient au bon utilisateur", function () {
          expect(String(res.getBody().userId)).to.equal(String(bru.getEnvVar("userId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
