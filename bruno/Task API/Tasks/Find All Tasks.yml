info:
  name: Find All Tasks
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/tasks?completed=false&priority=high"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: completed
      value: "false"
      type: query
    - name: priority
      value: high
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut 200", function(){
          expect(res.getStatus()).to.equal(200)
        });

        test("La réponse est un tableau", function(){
          expect(res.getBody()).to.be.an("array")
        });

        test("Contient au moins une tâche", function(){
          expect(res.getBody().length).to.be.above(0)
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
